<!-- Animations, step one of two: this script runs before
     anything on the page paints and flags the page as
     "JavaScript is on". That flag is what lets style.css start
     the .reveal blocks hidden (see the Motion section there);
     without JavaScript the flag never appears and every block
     simply shows, so nothing can be left invisible. Step two
     is animations.js, loaded below, which watches the blocks
     and reveals each as it scrolls into view. The setTimeout
     is a safety net: if animations.js ever fails to load, the
     flag comes back off and the page shows plainly instead of
     staying hidden. -->
<script>
document.documentElement.classList.add("js-reveal");
setTimeout(function () {
  if (!window.mayaRevealReady) {
    document.documentElement.classList.remove("js-reveal");
  }
}, 2000);
</script>

<!-- Event popup: hidden until an event day or list entry is
     clicked. The script below fills in the fields, and the
     "Add to calendar" row offers a Google Calendar link and an
     .ics file download (Apple Calendar / Outlook). -->
<div class="cal-modal-backdrop" id="cal-modal" hidden>
  <div class="cal-modal" role="dialog" aria-modal="true" aria-labelledby="cal-modal-title">
    <button type="button" class="cal-modal-close" id="cal-modal-close" aria-label="Close">&times;</button>
    <h3 id="cal-modal-title"></h3>
    <p id="cal-modal-when"></p>
    <p id="cal-modal-where"></p>
    <p id="cal-modal-linkrow"><a id="cal-modal-link" href="#">Event page</a></p>
    <p class="cal-modal-add">Add to calendar:</p>
    <p>
      <a class="button" id="cal-modal-google" href="#" target="_blank" rel="noopener">Google Calendar</a>
      <button type="button" class="button" id="cal-modal-ics">Apple / Outlook (.ics)</button>
    </p>
  </div>
</div>

<script>
// ----- Engagements month calendar -----
// The grid above is drawn from events.json, a plain data file
// sitting next to this page. Each event in it looks like:
//   { "date": "2026-11-20", "title": "Concert", "time": "19:30",
//     "location": "Some Hall", "url": "https://..." }
// Only date and title are required; time is 24-hour "HH:MM".
// If events.json cannot be loaded, the calendar still draws,
// just empty: the fetch at the bottom falls back to an empty
// list instead of breaking the page.

var events = [];                    // filled in by the fetch below
var today = new Date();
var viewYear = today.getFullYear(); // the month on screen starts
var viewMonth = today.getMonth();   // at the current month (0 = Jan)
var currentEvent = null;            // the event in the open popup
var lastTrigger = null;             // what opened the popup (focus return)

var MONTHS = ["January", "February", "March", "April", "May", "June",
              "July", "August", "September", "October", "November", "December"];
var DOWS = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];

// Parse "2026-11-20" into a local Date. Splitting by hand avoids
// the timezone shift in new Date("2026-11-20"), which parses as
// UTC and can land on the previous evening in California.
function parseDate(str) {
  var p = String(str).split("-");
  return new Date(+p[0], +p[1] - 1, +p[2]);
}

function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
      && a.getMonth() === b.getMonth()
      && a.getDate() === b.getDate();
}

function eventsOn(date) {
  return events.filter(function (ev) { return sameDay(parseDate(ev.date), date); });
}

function eventsInMonth(year, month) {
  return events
    .filter(function (ev) {
      var d = parseDate(ev.date);
      return d.getFullYear() === year && d.getMonth() === month;
    })
    .sort(function (a, b) { return parseDate(a.date) - parseDate(b.date); });
}

// "19:30" -> { h: 19, m: 30 }. Anything else (or no time at all)
// returns null, and the rest of the code treats the event as
// all-day. The popup still shows the raw time text either way.
function parseTime(ev) {
  if (!ev.time) return null;
  var match = /^(\d{1,2}):(\d{2})/.exec(ev.time);
  if (!match) return null;
  return { h: +match[1], m: +match[2] };
}

function timeLabel(ev) {
  var t = parseTime(ev);
  if (!t) return ev.time || "";
  return new Date(2000, 0, 1, t.h, t.m)
    .toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
}

// Escape text before it goes into innerHTML, so a title with an
// & or < in it cannot break the markup.
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function pad(n) { return (n < 10 ? "0" : "") + n; }
function stampDate(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()); }
function stampTime(d) { return stampDate(d) + "T" + pad(d.getHours()) + pad(d.getMinutes()) + "00"; }
function stampUtc(d) {
  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate())
       + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
}

// The event's start and end as Dates. With no known end time,
// a timed event is assumed to run 2 hours; an all-day event
// runs to the start of the next day.
function eventSpan(ev) {
  var day = parseDate(ev.date);
  var t = parseTime(ev);
  if (t) {
    var start = new Date(day.getFullYear(), day.getMonth(), day.getDate(), t.h, t.m);
    return { start: start, end: new Date(start.getTime() + 2 * 60 * 60 * 1000), timed: true };
  }
  return {
    start: day,
    end: new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1),
    timed: false
  };
}

// ----- The popup -----
var modal = document.getElementById("cal-modal");

function openEvent(ev, trigger) {
  currentEvent = ev;
  lastTrigger = trigger || null;
  document.getElementById("cal-modal-title").textContent = ev.title;
  var when = parseDate(ev.date).toLocaleDateString("en-US",
    { weekday: "long", month: "long", day: "numeric", year: "numeric" });
  var tl = timeLabel(ev);
  if (tl) when += " \u00B7 " + tl;
  document.getElementById("cal-modal-when").textContent = when;
  var where = document.getElementById("cal-modal-where");
  where.textContent = ev.location || "";
  where.hidden = !ev.location;
  var linkRow = document.getElementById("cal-modal-linkrow");
  var link = document.getElementById("cal-modal-link");
  if (ev.url) { link.href = ev.url; linkRow.hidden = false; } else { linkRow.hidden = true; }
  document.getElementById("cal-modal-google").href = googleUrl(ev);
  modal.hidden = false;
  // Send keyboard focus to the close button so the popup can be
  // dismissed without reaching for the mouse.
  document.getElementById("cal-modal-close").focus();
}

function closeEvent() {
  modal.hidden = true;
  if (lastTrigger) lastTrigger.focus();
}

document.getElementById("cal-modal-close").addEventListener("click", closeEvent);
// A click on the dimmed backdrop (not on the card itself) closes.
modal.addEventListener("click", function (e) { if (e.target === modal) closeEvent(); });
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !modal.hidden) closeEvent();
});
document.getElementById("cal-modal-ics").addEventListener("click", function () {
  if (currentEvent) downloadIcs(currentEvent);
});

// ----- "Add to calendar": Google -----
// Google Calendar's template link takes the event in the query
// string. Timed events use floating local times
// (YYYYMMDDTHHMMSS, no timezone suffix, so Google shows them in
// the viewer's own zone); all-day events use a date range.
function googleUrl(ev) {
  var span = eventSpan(ev);
  var dates = span.timed
    ? stampTime(span.start) + "/" + stampTime(span.end)
    : stampDate(span.start) + "/" + stampDate(span.end);
  var url = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text=" + encodeURIComponent(ev.title)
    + "&dates=" + encodeURIComponent(dates);
  if (ev.location) url += "&location=" + encodeURIComponent(ev.location);
  if (ev.url) url += "&details=" + encodeURIComponent(ev.url);
  return url;
}

// ----- "Add to calendar": Apple / Outlook (.ics) -----
// Builds a one-event .ics file in the browser and downloads it;
// no server involved. Commas, semicolons and backslashes in
// text fields must be escaped, per the iCalendar format.
function icsEscape(s) {
  return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;")
                  .replace(/,/g, "\\,").replace(/\n/g, "\\n");
}

function downloadIcs(ev) {
  var span = eventSpan(ev);
  var lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Maya Goell Soprano//Events//EN",
    "BEGIN:VEVENT",
    "UID:" + ev.date + "-" + ev.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "@mayagoellsoprano",
    "DTSTAMP:" + stampUtc(new Date())
  ];
  if (span.timed) {
    lines.push("DTSTART:" + stampTime(span.start));
    lines.push("DTEND:" + stampTime(span.end));
  } else {
    lines.push("DTSTART;VALUE=DATE:" + stampDate(span.start));
    lines.push("DTEND;VALUE=DATE:" + stampDate(span.end));
  }
  lines.push("SUMMARY:" + icsEscape(ev.title));
  if (ev.location) lines.push("LOCATION:" + icsEscape(ev.location));
  if (ev.url) lines.push("DESCRIPTION:" + icsEscape(ev.url));
  lines.push("END:VEVENT", "END:VCALENDAR");

  var blob = new Blob([lines.join("\r\n")], { type: "text/calendar" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ev.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + ".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
}

// ----- Drawing the month -----
function render() {
  document.getElementById("cal-title").textContent = MONTHS[viewMonth] + " " + viewYear;

  var html = "";
  DOWS.forEach(function (d) { html += '<div class="cal-dow">' + d + "</div>"; });
  var startBlank = new Date(viewYear, viewMonth, 1).getDay(); // 0 = Sunday
  var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  var i, d, date, dayEvents, cls;
  for (i = 0; i < startBlank; i++) html += '<div class="cal-day cal-blank"></div>';
  for (d = 1; d <= daysInMonth; d++) {
    date = new Date(viewYear, viewMonth, d);
    dayEvents = eventsOn(date);
    cls = "cal-day";
    if (sameDay(date, today)) cls += " today";
    if (dayEvents.length) {
      // Event days are real buttons, so they are focusable and
      // clickable by keyboard as well as mouse. A day with
      // several events opens the first; every event is also in
      // the list under the grid, each opening its own popup.
      html += '<button type="button" class="' + cls + '" data-day="' + d + '">'
           + d + "</button>";
    } else {
      html += '<div class="' + cls + '">' + d + "</div>";
    }
  }
  var grid = document.getElementById("cal-grid");
  grid.innerHTML = html;
  grid.querySelectorAll("button.cal-day").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var found = eventsOn(new Date(viewYear, viewMonth, +btn.getAttribute("data-day")));
      if (found.length) openEvent(found[0], btn);
    });
  });

  // The month's events under the grid, each opening its popup.
  // An empty month shows NOTHING under the grid: the original's
  // calendar has no "no events" line (its only empty-state text
  // lives inside the PosterMyWall widget), so the box is just
  // left empty.
  var listBox = document.getElementById("cal-events");
  var monthEvents = eventsInMonth(viewYear, viewMonth);
  if (!monthEvents.length) {
    listBox.innerHTML = "";
    return;
  }
  var items = monthEvents.map(function (ev, idx) {
    var label = parseDate(ev.date).toLocaleDateString("en-US",
      { weekday: "short", month: "short", day: "numeric" }) + " \u2014 " + esc(ev.title);
    var tl = timeLabel(ev);
    if (tl) label += ", " + esc(tl);
    if (ev.location) label += " \u00B7 " + esc(ev.location);
    return '<li><button type="button" class="cal-event-btn" data-idx="' + idx + '">'
         + label + "</button></li>";
  });
  listBox.innerHTML = '<ul class="cal-event-list">' + items.join("") + "</ul>";
  listBox.querySelectorAll(".cal-event-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      openEvent(monthEvents[+btn.getAttribute("data-idx")], btn);
    });
  });
}

document.getElementById("cal-prev").addEventListener("click", function () {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  render();
});
document.getElementById("cal-next").addEventListener("click", function () {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  render();
});

// Draw right away (empty if need be), then draw again once the
// events arrive. A failed fetch leaves the empty calendar up.
render();
fetch("events.json")
  .then(function (r) { return r.json(); })
  .then(function (data) {
    events = (data && data.constructor === Array) ? data : [];
    render();
  })
  .catch(function () { /* the empty calendar is already drawn */ });
</script>

</body>
