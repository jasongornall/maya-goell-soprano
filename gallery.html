<!-- The ?t= number is a cache-buster: bump it on every publish so
     browsers fetch the fresh stylesheet instead of a stale copy. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Animations, step one of two: this script runs before
     anything on the page paints and flags the page as
     "JavaScript is on". That flag is what lets style.css start
     the .reveal blocks hidden (see the Motion section there);
     without JavaScript the flag never appears and every block
     simply shows, so nothing can be left invisible. Step two
     is animations.js, loaded below, which watches the blocks
     and reveals each as it scrolls into view. The setTimeout
     is a safety net: if animations.js ever fails to load, the
     flag comes back off and the page shows plainly instead of
     staying hidden. -->
<script>
document.documentElement.classList.add("js-reveal");
setTimeout(function () {
  if (!window.mayaRevealReady) {
    document.documentElement.classList.remove("js-reveal");
  }
}, 2000);
</script>
<link rel="stylesheet" href="style.css?t=1794764981">
<script src="animations.js?t=1794764981" defer></script>
</head>

<main class="wrap page-gallery">

  <!-- On the original "Photo Gallery" is a mid-size heading set
       bold, and "Video Gallery" below is the full-size one;
       both are centered and pale sage (see style.css). -->
  <h1 class="center gallery-title reveal">Photo Gallery</h1>

  <!-- Same photos, in the same order, as the live site's gallery.
       The original's gallery is a masonry section: each photo
       goes into whichever column is currently shortest, so
       reading across the rows the photos stay in order. These
       photos are near-equal in height, so that works out to a
       strict alternation, and the two columns below are written
       out explicitly to match: odd-numbered photos on the left,
       even-numbered on the right, each at its natural shape.
       (A CSS-columns layout filled one column at a time and
       scrambled the visual order.) To add a photo: drop the
       file in assets/img/ and add its <img> line to whichever
       column is shorter.
       Each photo also carries its true position in an --o
       property. It does nothing at desktop width; at phone
       width style.css dissolves the two columns and uses
       these numbers to deal the photos back into 1-to-12
       order in the single stacked column, so the phone order
       matches the original's too. Keep the numbers in step
       when adding or moving a photo. -->
  <div class="gallery-grid">
    <div class="gallery-col">
      <img class="reveal reveal-fade" style="--o:1" src="assets/img/au-secours.jpg" alt="Maya Goell performing on stage">
      <img class="reveal reveal-fade" style="--o:3" src="assets/img/dsc05728.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:5" src="assets/img/mia-1547.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:7" src="assets/img/img-4834.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:9" src="assets/img/img-4707.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:11" src="assets/img/img-4833.jpg" alt="Maya Goell performance photo">
    </div>
    <div class="gallery-col">
      <img class="reveal reveal-fade" style="--o:2" src="assets/img/poncho-rabbit.jpg" alt="Poncho Rabbit production photo">
      <img class="reveal reveal-fade" style="--o:4" src="assets/img/mia-1151.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:6" src="assets/img/mia-1695.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:8" src="assets/img/img-4708.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:10" src="assets/img/img-4705.jpg" alt="Maya Goell performance photo">
      <img class="reveal reveal-fade" style="--o:12" src="assets/img/img-4709.jpg" alt="Maya Goell performance photo">
    </div>
  </div>

  <!-- The original's gallery page ends with two performance
       videos, side by side. These iframes embed the exact same
       YouTube videos (ids psEn3e1jcck and wPABymC_z4g, read from
       the live page), in the original's own embed form: the
       plain youtube.com host with its oEmbed query
       (?feature=oembed), copied from its markup. An earlier
       pass used the youtube-nocookie host instead; the videos
       were the same, but the round-5 comparison caught the
       player chrome differing (the original's player shows
       Share and Watch later, ours showed only Copy link),
       so the embed form now matches the original's exactly. -->
  <h2 class="center video-title reveal">Video Gallery</h2>
  <!-- Each video sits in a .video-frame with the shape the
       original renders, true 16:9 (see style.css). The reveal
       class is on the frame, not the iframe, so the reveal's
       transform never fights the iframe's own layout. -->
  <div class="video-grid">
    <div class="video-frame reveal"><iframe src="https://www.youtube.com/embed/psEn3e1jcck?feature=oembed" title="Non Monsieur Mon Mari- Les Mamelles des Theresias" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
    <div class="video-frame reveal"><iframe src="https://www.youtube.com/embed/wPABymC_z4g?feature=oembed" title="Presentation of the Rose from Der Rosenkavalier by Strauss" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
  </div>
